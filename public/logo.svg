<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <g transform="translate(256, 256)">
    <!-- Outer flow ring -->
    <path d="M0,-160 A160,160 0 1,1 0,160 A160,160 0 1,1 0,-160" 
          fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.3"
          stroke-dasharray="100,60" stroke-linecap="round"/>
    
    <!-- Inner flow ring -->
    <path d="M0,-100 A100,100 0 1,1 0,100 A100,100 0 1,1 0,-100" 
          fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.5"
          stroke-dasharray="60,40" stroke-linecap="round"/>
    
    <!-- Central node -->
    <circle r="48" fill="url(#accent)" filter="url(#glow)" opacity="0.9"/>
    
    <!-- Pulse rings -->
    <circle r="72" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4">
      <animate attributeName="r" values="72;120" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="72" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4">
      <animate attributeName="r" values="72;120" dur="2s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.4;0" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    
    <!-- Flow particles -->
    <g fill="url(#accent)">
      <circle cx="0" cy="-130" r="4" opacity="0.8">
        <animateMotion path="M0,-130 A130,130 0 1,1 0,130 A130,130 0 1,1 0,-130" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-130" r="3" opacity="0.6">
        <animateMotion path="M0,-130 A130,130 0 1,1 0,130 A130,130 0 1,1 0,-130" dur="6s" repeatCount="indefinite" begin="2s"/>
      </circle>
      <circle cx="0" cy="-130" r="3" opacity="0.6">
        <animateMotion path="M0,-130 A130,130 0 1,1 0,130 A130,130 0 1,1 0,-130" dur="6s" repeatCount="indefinite" begin="4s"/>
      </circle>
    </g>
    
    <!-- Inner orbit particles -->
    <g fill="url(#accent)">
      <circle cx="0" cy="-70" r="3" opacity="0.7">
        <animateMotion path="M0,-70 A70,70 0 1,1 0,70 A70,70 0 1,1 0,-70" dur="4s" repeatCount="indefinite" begin="1s"/>
      </circle>
      <circle cx="0" cy="-70" r="2" opacity="0.5">
        <animateMotion path="M0,-70 A70,70 0 1,1 0,70 A70,70 0 1,1 0,-70" dur="4s" repeatCount="indefinite" begin="3s"/>
      </circle>
    </g>
  </g>
</svg>